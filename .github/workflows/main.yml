name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'values.yaml'
      - 'README.md'

jobs:

  # ==========================================
  # JOB 1: Simple Code Analyzer
  # ==========================================
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analyzer
        run: |
          pip install flake8

      - name: Run code analysis
        run: |
          flake8 .

  # ==========================================
  # JOB 2: Build and Push Docker Image
  # ==========================================
  build:
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nginx:${{ github.run_id }}

  # ==========================================
  # JOB 3: Update Helm Chart
  # ==========================================
  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          ref: main

      - name: Update tag in values.yaml
        run: |
          sed -i 's/^[[:space:]]*tag:.*/  tag: "${{ github.run_id }}"/' values.yaml

      - name: Commit and push changes
        run: |
          git config user.email "babusuccess@gmail.com"
          git config user.name "babusuccess"

          git add values.yaml
          git commit -m "Update image tag to ${{ github.run_id }}" || echo "No changes"
          git push origin HEAD:main
