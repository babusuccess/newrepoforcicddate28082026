# CI/CD using GitHub Actions
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'values.yaml'
      - 'README.md'

jobs:

  # ==========================================
  # JOB 1: SonarQube Code Analysis
  # ==========================================
  code-analysis:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Code Analysis
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  # ==========================================
  # JOB 2: Build and Push Docker Image
  # ==========================================
  build:
    runs-on: ubuntu-latest

    needs: code-analysis

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nginx:${{ github.run_id }}

  # ==========================================
  # JOB 3: Update image tag in values.yaml
  # ==========================================
  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          ref: main

      - name: Update tag in values.yaml
        run: |
          sed -i 's/^[[:space:]]*tag:.*/  tag: "${{ github.run_id }}"/' values.yaml

          echo "Updated values.yaml:"
          cat values.yaml

      - name: Check changes
        run: |
          echo "Git status:"
          git status

          echo "Git diff:"
          git diff -- values.yaml

      - name: Commit and push changes
        run: |
          git config user.email "babusuccess@gmail.com"
          git config user.name "babusuccess"

          git add values.yaml

          git commit -m "Update image tag to ${{ github.run_id }}"

          git push origin HEAD:main
